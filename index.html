      const MoviesView = ({ likedItems, toggleLike }) => {
        const [movies, setMovies] = useState([]);
        const [loading, setLoading] = useState(true);
        const apiKey = 'cac04f877c2c8ae78758f05b158d796d';
        const movieTitles = ['Wolfs', 'Civil War', 'Flow', 'Bullet Train', 'A Man Called Otto', 'Old Dads'];
        const trailerLinks = ['https://www.youtube.com/watch?v=wLJUPjiRbAM&t=2s', 'https://www.youtube.com/watch?v=aDyQxtg0V2w', 'https://www.youtube.com/watch?v=82WW9dVbglI', 'https://www.youtube.com/watch?v=0IOsk2Vlc4o&pp', 'https://www.youtube.com/watch?v=eFYUX9l-m5I', 'https://www.youtube.com/watch?v=mU01e6KjM2s'];
        const downloadLinks = ['https://drive.google.com/file/d/1mHVVk1VzNyIFKh_SRZAM6bdfwa5KHz03/view?usp=sharing', 'https://drive.google.com/file/d/1LHyxj6ayYSmtkquL14puDVrKea_HPJO4/view?usp=sharing', 'https://drive.google.com/file/d/1rg1zE-52Ms6a-VTHdBtk37XC8HueNgt6/view?usp=sharing', 'https://drive.google.com/file/d/14HgGEkf8s219svgihQYSy0uAbOAtRwa1/view?usp=sharing', 'https://drive.google.com/file/d/1MTnqRvX-euneRArCKEv9kUrL9eVgMbsA/view?usp=sharing', 'https://drive.google.com/file/d/1OiM3KUjfRhVKHmXAac78jbyCQ8eaHvGd/view?usp=sharing'];

        useEffect(() => {
          const fetchAllMovies = async () => {
            const loadedMovies = await Promise.all(movieTitles.map(async (title, idx) => {
              const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(title)}`);
              const data = await res.json();
              if (data.results && data.results.length > 0) {
                const id = data.results[0].id;
                const dRes = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${apiKey}&language=en-US`);
                const details = await dRes.json();
                return { ...details, trailer: trailerLinks[idx], download: downloadLinks[idx] };
              }
              return null;
            }));
            setMovies(loadedMovies.filter(Boolean));
            setLoading(false);
          };
          fetchAllMovies();
        }, []);

        if (loading) return <div className="py-24 text-center">Memuat koleksi film...</div>;
        return (
          <div className="flex flex-col gap-4 w-full max-w-6xl mx-auto px-6">
            {movies.map((movie) => (
              <div key={movie.id} className="movie-light-card">
                <img className="movie-poster" src={`https://image.tmdb.org/t/p/w500${movie.poster_path}`} alt={movie.title} />
                <div className="movie-light-info">
                  <h3>{movie.title}</h3>
                  <p className="release-date">Release Date: {movie.release_date}</p>
                  <div>
                    <span className="runtime">{movie.runtime} Min</span>
                    <span className="genre">{movie.genres.map(g => g.name).join(', ')}</span>
                  </div>
                  <p className="line-clamp-3 overview text-slate-500 mt-2">{movie.overview}</p>
                  <div className="movie-light-buttons">
                    <a href={movie.trailer} target="_blank" className="btn-trailer">Trailer</a>
                    <a href={movie.download} target="_blank" className="btn-download">Download</a>
                  </div>
                </div>
                <div className="movie-light-cover-fade" style={{ backgroundImage: `url('https://image.tmdb.org/t/p/w780${movie.backdrop_path}')` }}></div>
              </div>
            ))}
          </div>
        );
      };

      function App() {
        // ... (existing App logic preserved)
        return (
