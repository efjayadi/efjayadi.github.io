<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fajar Jayadi | Solusi Desain Branding, Website & Gambar 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght=900&display=swap');
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .book-container { perspective: 2500px; }
        .shadow-book { box-shadow: 0 30px 75px -12px rgba(0,0,0,0.5); }
        .movie-light-card { height: 360px; background-color: #f8fafc; border-radius: 1.5rem; overflow: hidden; border: 1px solid rgba(226,232,240,0.8); display: flex; align-items: stretch; margin: 16px auto; width: 100%; max-width: 1080px; transition: all 0.4s ease; position: relative; }
        .movie-light-card:hover { transform: translateY(-4px) scale(1.005); border-color: rgba(203,213,225,0.9); }
        .movie-poster { flex: 0 0 150px; margin: 24px; object-fit: cover; border-radius: 0.75rem; }
        .movie-light-info { padding: 32px; flex-grow: 1; z-index: 10; display: flex; flex-direction: column; justify-content: center; }
        .movie-light-cover-fade { position: absolute; right: 0; top: 0; bottom: 0; width: 55%; background-size: cover; background-position: center; opacity: 1.0; z-index: 1; mask-image: linear-gradient(to left, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%); }
        .btn-trailer { border: 1.5px solid #0f172a; padding: 10px 24px; border-radius: 9999px; font-weight: 700; text-decoration: none; color: #0f172a; }
        .btn-download { background-color: #0f172a; color: white; padding: 10px 24px; border-radius: 9999px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const portfolioData = {
          logo: ['/assets/img/portfolio/Logo/ayamdjagoan.png'],
          media_cetak: [
              { thumbnail: '/assets/img/portfolio/Book/book-tgg.png', src: '/assets/img/portfolio/Book/tgg.pdf', title: 'PT. Tachinardi Global Group', desc: 'Company Profile', isBook: true }
          ]
      };

      // Komponen Movie
      const MoviesPage = () => {
        const [movies, setMovies] = useState([
            { id: 1, title: 'Wolfs', release: '2024', runtime: '108', genre: 'Comedy, Crime', desc: 'Two rival fixers cross paths...', poster: 'https://image.tmdb.org/t/p/w500/iH7F3h7e9u7N46f90d56.jpg', backdrop: 'https://image.tmdb.org/t/p/w780/h9YvU1XbO4iYqgT.jpg' }
        ]);
        return (
            <div className="pt-40 pb-20 px-6">
                <h2 className="text-center text-4xl font-black mb-12">Film Bagus</h2>
                {movies.map(m => (
                    <div key={m.id} className="movie-light-card">
                        <img className="movie-poster" src={m.poster} alt={m.title} />
                        <div className="movie-light-info">
                            <h3 className="text-2xl font-bold">{m.title}</h3>
                            <p className="text-sm">{m.release} • {m.runtime} Min • {m.genre}</p>
                            <p className="text-xs line-clamp-3 mt-2 text-slate-500">{m.desc}</p>
                            <div className="flex gap-3 mt-4">
                                <a href="#" className="btn-trailer">Trailer</a>
                                <a href="#" className="btn-download">Download</a>
                            </div>
                        </div>
                        <div className="movie-light-cover-fade" style={{ backgroundImage: `url('${m.backdrop}')` }}></div>
                    </div>
                ))}
            </div>
        );
      };

      function App() {
        const [currentPage, setCurrentPage] = useState('home');
        
        return (
            <div className="w-full min-h-screen bg-white">
                <nav className="fixed w-full p-6 flex justify-between bg-white/80 backdrop-blur z-50">
                    <span className="font-bold text-xl cursor-pointer" onClick={() => setCurrentPage('home')}>Fajar Jayadi</span>
                    <div className="flex gap-4">
                        <a href="#" onClick={() => setCurrentPage('home')}>Home</a>
                        <a href="#" onClick={() => setCurrentPage('portfolio')}>Portofolio</a>
                        <a href="#" onClick={() => setCurrentPage('movies')}>Film Bagus</a>
                    </div>
                </nav>

                <main>
                    {currentPage === 'home' && <div className="pt-40 text-center">Home Page Content</div>}
                    {currentPage === 'portfolio' && <div className="pt-40 text-center">Portfolio Page Content</div>}
                    {currentPage === 'movies' && <MoviesPage />}
                </main>

                <footer className="bg-slate-900 text-white p-10 mt-20">
                    <div className="flex justify-around">
                         <div><h4 className="font-bold">Sharing</h4><ul><li><a href="#" onClick={() => setCurrentPage('movies')}>Film Bagus</a></li></ul></div>
                    </div>
                </footer>
            </div>
        );
      }
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
